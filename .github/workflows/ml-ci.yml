# Add this once the /ml folder exists (Phase 2).
name: ML CI

on:
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"

concurrency:
  group: ml-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test training code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Windowing, normalization, and metadata tests.
      # Keep these CPU-only and fast (no real training here).
      - name: Unit tests
        run: pytest -q